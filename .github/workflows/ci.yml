name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-build-package:
    name: Validate, build, and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate manifests
        run: npm run validate

      - name: Build runtime catalog
        run: npm run build:skip-validation

      - name: Run resolver examples
        run: |
          npm run resolve:example
          npm run resolve:saas
          npm run resolve:metadata
          npm run resolve:expected-rejection

      - name: Check resolver output shape
        run: npm run check:resolver-output

      - name: Create release package
        run: npm run package:from-dist

      - name: Check license boundaries
        run: npm run check:boundaries

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: instrument-atlas-sounds-package
          path: release/*.zip
          if-no-files-found: error